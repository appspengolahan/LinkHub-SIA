<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Divisi Produksi I - Link Hub</title>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    iframe { border:0; width:100%; height:100vh; height:100dvh; display:block; }
  </style>
</head>
<body>
  <iframe id="app" allow="clipboard-write"></iframe>
  <script>
    // GANTI dengan URL /exec Web App Link Hub ini (Deploy > New deployment
    // > Web app). Redeploy versi BARU dari deployment yang SAMA tidak
    // mengubah URL ini, jadi biasanya tidak perlu diganti lagi setelahnya.
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbwOllisiA-H5MEZypbA8XQYhR1fwFre3XpdCrbkGGcgQHya5NffmqjIfzYAfODcvO_Qrg/exec";
    var iframe = document.getElementById('app');

    // Samakan tinggi iframe dengan tinggi layar yang BENAR-BENAR terlihat
    // di HP. 100vh/100dvh saja kadang masih meleset di sebagian browser HP
    // saat address bar menyembul/menyusut ketika scroll -- ini bikin
    // tombol/navbar di bagian bawah halaman ketutup. window.visualViewport
    // lebih akurat.
    function setIframeHeight(){
      var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      iframe.style.height = h + 'px';
    }
    setIframeHeight();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setIframeHeight);
    } else {
      window.addEventListener('resize', setIframeHeight);
    }

    function loadMode(mode){
      // "mode" di sini sebenarnya adalah nilai parameter ?page= di project
      // Link Hub (page=admin, atau kosong untuk halaman publik) -- namanya
      // tetap "mode" di wrapper ini supaya konsisten dengan skema
      // INSTRUKSI-REMOVE-BANNER.md, tapi secara teknis dikirim sebagai
      // query param "page" ke Apps Script.
      iframe.src = EXEC_URL + '?embed=1' + (mode ? ('&page=' + encodeURIComponent(mode)) : '');
    }

    // Baca parameter ?page= dari URL wrapper ITU SENDIRI saat pertama
    // dibuka -- supaya link admin yang dibagikan langsung (misal
    // ".../link-hub/?page=admin") langsung membuka Panel Admin, bukan
    // selalu jatuh ke halaman publik.
    function getInitialPageFromUrl_() {
      var params = new URLSearchParams(window.location.search);
      return params.get('page') || '';
    }
    loadMode(getInitialPageFromUrl_());

    window.addEventListener('message', function(e){
      if (!e.data || typeof e.data !== 'object' || e.data.type !== 'gkf-linkhub-navigate') return;
      loadMode(e.data.mode || '');
    });
  </script>
</body>
</html>
